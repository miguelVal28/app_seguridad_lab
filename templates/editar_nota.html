{% extends "base.html" %}
{% block title %}Editar nota{% endblock %}
{% block contenido %}
    <h1>Editar calificacion #{{ calificacion['id'] }}</h1>
    <p><strong>Materia:</strong> {{ calificacion['materia'] }}</p>
    <p><strong>Estudiante ID:</strong> {{ calificacion['estudiante_id'] }}</p>
    <form method="POST" action="{{ url_for('editar_nota', id=calificacion['id']) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>Nueva nota:
            <input type="text" name="nota" value="{{ calificacion['nota'] }}">
        </label>
        <button type="submit">Guardar</button>
    </form>
{% endblock %}
